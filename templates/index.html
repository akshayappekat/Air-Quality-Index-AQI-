<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Air Quality Index Calculator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 860px;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    header h1 {
      font-size: 2.4rem;
      color: #fff;
      letter-spacing: 1px;
    }

    header p {
      color: #a0c4d8;
      margin-top: 8px;
      font-size: 1rem;
    }

    .card {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      padding: 32px;
      color: #fff;
    }

    .card h2 {
      font-size: 1.2rem;
      margin-bottom: 20px;
      color: #a0d8ef;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 600;
    }

    .inputs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 20px;
      margin-bottom: 28px;
    }

    .input-group label {
      display: block;
      font-size: 0.82rem;
      color: #a0c4d8;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .input-group input {
      width: 100%;
      padding: 11px 14px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border 0.2s, background 0.2s;
    }

    .input-group input:focus {
      border-color: #4fc3f7;
      background: rgba(79,195,247,0.1);
    }

    .input-group input::placeholder {
      color: rgba(255,255,255,0.3);
    }

    .btn {
      width: 100%;
      padding: 14px;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: linear-gradient(90deg, #4fc3f7, #0288d1);
      color: #fff;
      letter-spacing: 1px;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }

    /* Result section */
    #result {
      margin-top: 32px;
      display: none;
    }

    .aqi-display {
      text-align: center;
      padding: 30px 20px;
      border-radius: 18px;
      margin-bottom: 24px;
      transition: background 0.5s;
    }

    .aqi-number {
      font-size: 5rem;
      font-weight: 800;
      line-height: 1;
    }

    .aqi-label {
      font-size: 1.6rem;
      font-weight: 600;
      margin-top: 8px;
    }

    .aqi-advice {
      font-size: 0.95rem;
      margin-top: 12px;
      opacity: 0.9;
      max-width: 480px;
      margin-left: auto;
      margin-right: auto;
    }

    .dominant {
      margin-top: 10px;
      font-size: 0.9rem;
      opacity: 0.8;
    }

    .sub-aqis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 14px;
      margin-top: 8px;
    }

    .sub-aqi-card {
      background: rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 14px 10px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .sub-aqi-card .pollutant-name {
      font-size: 0.78rem;
      color: #a0c4d8;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .sub-aqi-card .pollutant-val {
      font-size: 1.6rem;
      font-weight: 700;
      margin-top: 4px;
    }

    /* AQI Scale legend */
    .scale-bar {
      display: flex;
      border-radius: 8px;
      overflow: hidden;
      height: 14px;
      margin-top: 24px;
    }

    .scale-bar div { flex: 1; }

    .scale-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: #a0c4d8;
      margin-top: 4px;
    }

    .scale-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: #cde;
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .error-msg {
      color: #ff6b6b;
      text-align: center;
      margin-top: 16px;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🌍 Air Quality Index</h1>
      <p>Enter pollutant concentrations to calculate the AQI instantly</p>
    </header>

    <div class="card">
      <h2>Pollutant Inputs</h2>
      <div class="inputs-grid">
        <div class="input-group">
          <label>PM2.5 (µg/m³)</label>
          <input type="number" id="pm25" placeholder="e.g. 25" min="0" step="0.1" />
        </div>
        <div class="input-group">
          <label>PM10 (µg/m³)</label>
          <input type="number" id="pm10" placeholder="e.g. 55" min="0" step="0.1" />
        </div>
        <div class="input-group">
          <label>NO₂ (µg/m³)</label>
          <input type="number" id="no2" placeholder="e.g. 40" min="0" step="0.1" />
        </div>
        <div class="input-group">
          <label>SO₂ (µg/m³)</label>
          <input type="number" id="so2" placeholder="e.g. 5" min="0" step="0.1" />
        </div>
        <div class="input-group">
          <label>CO (mg/m³)</label>
          <input type="number" id="co" placeholder="e.g. 0.6" min="0" step="0.01" />
        </div>
      </div>

      <button class="btn" onclick="calculateAQI()">Calculate AQI</button>

      <div id="error-msg" class="error-msg" style="display:none;"></div>

      <!-- Result -->
      <div id="result">
        <div class="aqi-display" id="aqi-display">
          <div class="aqi-number" id="aqi-number">--</div>
          <div class="aqi-label" id="aqi-label">--</div>
          <div class="aqi-advice" id="aqi-advice"></div>
          <div class="dominant" id="dominant-pollutant"></div>
        </div>

        <h2>Sub-Index by Pollutant</h2>
        <div class="sub-aqis" id="sub-aqis"></div>

        <!-- AQI scale -->
        <div class="scale-bar" style="margin-top:28px;">
          <div style="background:#00e400;"></div>
          <div style="background:#ffff00;"></div>
          <div style="background:#ff7e00;"></div>
          <div style="background:#ff0000;"></div>
          <div style="background:#8f3f97;"></div>
          <div style="background:#7e0023;"></div>
        </div>
        <div class="scale-labels">
          <span>0</span><span>50</span><span>100</span><span>150</span><span>200</span><span>300</span><span>500</span>
        </div>
        <div class="scale-legend">
          <div class="legend-item"><div class="legend-dot" style="background:#00e400;"></div>Good</div>
          <div class="legend-item"><div class="legend-dot" style="background:#ffff00;"></div>Moderate</div>
          <div class="legend-item"><div class="legend-dot" style="background:#ff7e00;"></div>Unhealthy (Sensitive)</div>
          <div class="legend-item"><div class="legend-dot" style="background:#ff0000;"></div>Unhealthy</div>
          <div class="legend-item"><div class="legend-dot" style="background:#8f3f97;"></div>Very Unhealthy</div>
          <div class="legend-item"><div class="legend-dot" style="background:#7e0023;"></div>Hazardous</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function calculateAQI() {
      const pm25 = document.getElementById('pm25').value;
      const pm10 = document.getElementById('pm10').value;
      const no2  = document.getElementById('no2').value;
      const so2  = document.getElementById('so2').value;
      const co   = document.getElementById('co').value;

      document.getElementById('error-msg').style.display = 'none';

      const response = await fetch('/calculate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pm25, pm10, no2, so2, co })
      });

      const data = await response.json();

      if (data.error) {
        document.getElementById('error-msg').textContent = data.error;
        document.getElementById('error-msg').style.display = 'block';
        document.getElementById('result').style.display = 'none';
        return;
      }

      // Update AQI display
      document.getElementById('aqi-number').textContent = data.aqi;
      document.getElementById('aqi-label').textContent  = data.category;
      document.getElementById('aqi-advice').textContent = data.advice;
      document.getElementById('dominant-pollutant').textContent =
        `Dominant Pollutant: ${data.dominant_pollutant}`;

      const display = document.getElementById('aqi-display');
      display.style.background = hexToRgba(data.color, 0.25);
      display.style.border = `2px solid ${data.color}`;
      display.style.color = '#fff';

      // Sub-AQIs
      const subContainer = document.getElementById('sub-aqis');
      subContainer.innerHTML = '';
      for (const [name, val] of Object.entries(data.sub_aqis)) {
        const cat = getCategory(val);
        subContainer.innerHTML += `
          <div class="sub-aqi-card">
            <div class="pollutant-name">${name}</div>
            <div class="pollutant-val" style="color:${cat.color}">${val}</div>
            <div style="font-size:0.75rem;color:#aaa;margin-top:4px;">${cat.label}</div>
          </div>`;
      }

      document.getElementById('result').style.display = 'block';
    }

    function hexToRgba(hex, alpha) {
      const r = parseInt(hex.slice(1,3),16);
      const g = parseInt(hex.slice(3,5),16);
      const b = parseInt(hex.slice(5,7),16);
      return `rgba(${r},${g},${b},${alpha})`;
    }

    function getCategory(aqi) {
      if (aqi <= 50)  return { label: "Good",         color: "#00e400" };
      if (aqi <= 100) return { label: "Moderate",     color: "#ffff00" };
      if (aqi <= 150) return { label: "USG",          color: "#ff7e00" };
      if (aqi <= 200) return { label: "Unhealthy",    color: "#ff0000" };
      if (aqi <= 300) return { label: "Very Unhealthy", color: "#8f3f97" };
      return            { label: "Hazardous",         color: "#7e0023" };
    }

    // Allow Enter key to trigger calculation
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') calculateAQI();
    });
  </script>
</body>
</html>
